name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n install.sh scripts/tunnel-status.sh scripts/tunnel-uninstall.sh
      - run: node -e 'JSON.parse(require("fs").readFileSync("config.full.example.json", "utf8"))'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm gate
