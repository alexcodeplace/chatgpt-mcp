name: gate

on:
  push:
    branches-ignore: ['overdeck-build/**']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n install.sh scripts/tunnel-status.sh scripts/tunnel-uninstall.sh
      - run: node -e 'JSON.parse(require("fs").readFileSync("config.full.example.json", "utf8"))'
      - run: pnpm install --frozen-lockfile
      - name: Verify live-proof capability reporting
        run: python3 -B scripts/test_hot_swap.py LiveProofMetadataTests -v
      - name: Prove disconnect cancellation and live adoption before broad tests
        run: pnpm exec tsx --test test/hotswap-gc.test.ts test/hotswap-adoption.test.ts
      - run: python3 -m unittest discover -s test -p "*_test.py" -v
      - run: pnpm gate
      - name: Prove compiled upgrade and ownership semantics
        run: node --test dist/test/hotswap-gc.test.js dist/test/hotswap-adoption.test.js dist/test/hotswap.test.js dist/test/hotswap-recording.test.js
      # This repository explicitly disallows GitHub-hosted artifact uploads.
      # Verify the immutable package here; operators package the same tested
      # revision locally with scripts/release.py for managed deployment.
      - name: Verify immutable exact-revision runtime packaging
        run: |
          python3 scripts/release.py pack --source "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/mcp-runtime-$GITHUB_SHA" --revision "$GITHUB_SHA"
          python3 scripts/release.py verify "$RUNNER_TEMP/mcp-runtime-$GITHUB_SHA"
